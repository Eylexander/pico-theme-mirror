name: Build and publish the mirror

on:
  schedule:
    - cron: "0 4 * * *" # daily check; it only rebuilds when the theme catalog changed
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.skip.outputs.skip != 'true' }}
      marker: ${{ steps.source.outputs.marker }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the catalog version
        id: source
        run: |
          commit=$(git ls-remote https://github.com/flashcarts/kernel-themes.git HEAD | cut -f1)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "marker=published-$commit-${{ hashFiles('build.py', 'lz10.py') }}" >> "$GITHUB_OUTPUT"

      # A marker per published (catalog, generator) pair. Scheduled runs stop here when
      # nothing changed; restoring it daily also keeps GitHub from expiring it.
      - name: Check if this version is published
        id: published
        uses: actions/cache/restore@v4
        with:
          path: .published
          key: ${{ steps.source.outputs.marker }}

      - name: Decide
        id: skip
        run: echo "skip=${{ steps.published.outputs.cache-hit == 'true' && github.event_name == 'schedule' }}" >> "$GITHUB_OUTPUT"

      # Downloaded archives (~3 GB) and compressed files, kept between builds so a
      # build only downloads and compresses what is new. Saved only when the catalog
      # changed (the key is per catalog version), not on every run.
      - if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            cache/dl
            cache/lz
          key: theme-archives-${{ steps.source.outputs.commit }}
          restore-keys: theme-archives-

      - if: steps.skip.outputs.skip != 'true'
        name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - if: steps.skip.outputs.skip != 'true'
        name: Build the mirror
        run: python -I build.py

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Only once it is live, so a failed deploy is retried by the next daily check.
      - name: Mark this version as published
        run: echo published > .published
      - uses: actions/cache/save@v4
        with:
          path: .published
          key: ${{ needs.build.outputs.marker }}
